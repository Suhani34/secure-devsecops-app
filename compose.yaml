name: secure-devsecops-app


services:

  db:

    image: postgres:18.6-bookworm

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      POSTGRES_DB: postgres

      APP_DB_USER: ${DB_USER}
      APP_DB_PASSWORD_FILE: /run/secrets/db_password
      APP_DB_NAME: ${DB_NAME}
      APP_TEST_DB_NAME: ${TEST_DB_NAME}

    secrets:
      - postgres_admin_password
      - db_password

    volumes:
      - postgres_data:/var/lib/postgresql

      - ./docker/postgres/init/01-create-app-user.sh:/docker-entrypoint-initdb.d/01-create-app-user.sh:ro

    networks:
      - backend

    read_only: true

    tmpfs:
      - /tmp:mode=1777
      - /var/run/postgresql:mode=3775

    cap_drop:
      - NET_RAW

    security_opt:
      - no-new-privileges:true

    pids_limit: 200
    mem_limit: 512m
    cpus: "1.0"

    restart: unless-stopped

    stop_grace_period: 30s

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d postgres"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"



  db-init:

    image: secure-task-api:0.3

    user: "10001:10001"

    command:
      - sh
      - -c
      - python -m app.init_db && DB_NAME=$$TEST_DB_NAME python -m app.init_db

    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD_FILE: /run/secrets/db_password
      TEST_DB_NAME: ${TEST_DB_NAME}

    secrets:
      - db_password

    depends_on:
      db:
        condition: service_healthy

    networks:
      - backend

    read_only: true

    tmpfs:
      - /tmp:mode=1777

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    pids_limit: 50
    mem_limit: 128m
    cpus: "0.25"

    init: true

    restart: "no"

    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"



  api:

    build:
      context: .

    image: secure-task-api:0.3

    user: "10001:10001"

    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD_FILE: /run/secrets/db_password

    secrets:
      - db_password

    depends_on:
      db:
        condition: service_healthy

      db-init:
        condition: service_completed_successfully

    expose:
      - "8000"

    networks:
      - frontend
      - backend

    read_only: true

    tmpfs:
      - /tmp:mode=1777

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    pids_limit: 100
    mem_limit: 256m
    cpus: "0.50"

    init: true

    restart: unless-stopped

    stop_grace_period: 15s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"



  nginx:

    image: nginx:1.30.4-alpine

    user: "101:101"

    entrypoint:
      - nginx

    command:
      - -g
      - daemon off;

    depends_on:
      api:
        condition: service_healthy

    ports:
      - "127.0.0.1:8080:8080"

    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    networks:
      - frontend

    read_only: true

    tmpfs:
      - /var/cache/nginx:uid=101,gid=101,mode=0755
      - /var/run:uid=101,gid=101,mode=0755
      - /tmp:uid=101,gid=101,mode=1777

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    pids_limit: 50
    mem_limit: 128m
    cpus: "0.25"

    restart: unless-stopped

    stop_grace_period: 10s

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:8080/nginx-health >/dev/null 2>&1 || exit 1"
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"



volumes:

  postgres_data:



networks:

  frontend:

  backend:
    internal: true



secrets:

  db_password:
    file: ./secrets/db_password.txt

  postgres_admin_password:
    file: ./secrets/postgres_admin_password.txt
