name: CI


on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:


permissions:
  contents: read


concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:

  test:

    name: Python Tests

    runs-on: ubuntu-24.04

    timeout-minutes: 10


    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"

      DB_NAME: secure_tasks_test
      DB_USER: secure_app

      DB_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}

      TEST_DB_NAME: secure_tasks_test


    services:

      postgres:

        image: postgres:18.6-bookworm

        env:
          POSTGRES_USER: secure_app
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: secure_tasks_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U secure_app -d secure_tasks_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10


    steps:

      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false


      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 #v7.0.0

        with:
          python-version: "3.12"

          cache: pip

          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt


      - name: Show Python version
        run: |
          python --version
          python -m pip --version


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt


      - name: Verify PostgreSQL connection
        run: |
          python - <<'PY'
          import os
          import psycopg

          connection = psycopg.connect(
              host=os.environ["DB_HOST"],
              port=os.environ["DB_PORT"],
              dbname=os.environ["DB_NAME"],
              user=os.environ["DB_USER"],
              password=os.environ["DB_PASSWORD"],
          )

          with connection.cursor() as cursor:
              cursor.execute(
                  "SELECT current_database(), current_user"
              )

              database, user = cursor.fetchone()

          connection.close()

          print(
              f"PostgreSQL connection successful: "
              f"database={database}, user={user}"
          )
          PY


      - name: Run tests with coverage
        run: |
          python -m pytest \
            -v \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml


  secret-scan:

    name: Secret Scan - Gitleaks

    runs-on: ubuntu-24.04

    timeout-minutes: 5


    permissions:
      contents: read


    steps:

      - name: Check out full Git history
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false


      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e #v3.0.0

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          GITLEAKS_VERSION: "8.30.1"

          GITLEAKS_ENABLE_COMMENTS: "false"

          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

          GITLEAKS_ENABLE_SUMMARY: "true"


  sast:

    name: SAST - Semgrep

    runs-on: ubuntu-24.04

    timeout-minutes: 10


    permissions:
      contents: read


    container:
      image: semgrep/semgrep:1.175.0


    steps:

      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false


      - name: Show Semgrep version
        run: |
          semgrep --version


      - name: Run Semgrep SAST
        run: |
          semgrep scan \
            --config auto \
            --error \
            .
  dependency-scan:

    name: Dependency & Config Scan - Trivy

    runs-on: ubuntu-24.04

    timeout-minutes: 10


    permissions:
      contents: read


    steps:

      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false


      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
          cache: true


      - name: Show Trivy version
        run: |
          trivy --version


      - name: Report HIGH and CRITICAL findings
        run: |
          trivy fs \
            --scanners vuln,misconfig \
            --file-patterns 'pip:requirements-dev\.txt' \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            .


      - name: Enforce fixable HIGH and CRITICAL gate
        run: |
          trivy fs \
            --scanners vuln,misconfig \
            --file-patterns 'pip:requirements-dev\.txt' \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            .
