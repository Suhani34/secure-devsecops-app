name: CI


on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:


permissions:
  contents: read


concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:

  test:

    name: Python Tests

    runs-on: ubuntu-24.04

    timeout-minutes: 10


    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"

      DB_NAME: secure_tasks_test
      DB_USER: secure_app

      DB_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}

      TEST_DB_NAME: secure_tasks_test


    services:

      postgres:

        image: postgres:18.6-bookworm

        env:
          POSTGRES_USER: secure_app
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: secure_tasks_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U secure_app -d secure_tasks_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10


    steps:

      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false


      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 #v7.0.0

        with:
          python-version: "3.12"

          cache: pip

          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt


      - name: Show Python version
        run: |
          python --version
          python -m pip --version


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt


      - name: Verify PostgreSQL connection
        run: |
          python - <<'PY'
          import os
          import psycopg

          connection = psycopg.connect(
              host=os.environ["DB_HOST"],
              port=os.environ["DB_PORT"],
              dbname=os.environ["DB_NAME"],
              user=os.environ["DB_USER"],
              password=os.environ["DB_PASSWORD"],
          )

          with connection.cursor() as cursor:
              cursor.execute(
                  "SELECT current_database(), current_user"
              )

              database, user = cursor.fetchone()

          connection.close()

          print(
              f"PostgreSQL connection successful: "
              f"database={database}, user={user}"
          )
          PY


      - name: Run tests with coverage
        run: |
          python -m pytest \
            -v \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=80


  secret-scan:

    name: Secret Scan - Gitleaks

    runs-on: ubuntu-24.04

    timeout-minutes: 5


    permissions:
      contents: read


    steps:

      - name: Check out full Git history
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false


      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e #v3.0.0

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          GITLEAKS_VERSION: "8.30.1"

          GITLEAKS_ENABLE_COMMENTS: "false"

          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

          GITLEAKS_ENABLE_SUMMARY: "true"


  sast:

    name: SAST - Semgrep

    runs-on: ubuntu-24.04

    timeout-minutes: 10


    permissions:
      contents: read


    container:
      image: semgrep/semgrep:1.175.0


    steps:

      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false


      - name: Show Semgrep version
        run: |
          semgrep --version


      - name: Run Semgrep SAST
        run: |
          semgrep scan \
            --config auto \
            --error \
            .
  dependency-scan:

    name: Dependency & Config Scan - Trivy

    runs-on: ubuntu-24.04

    timeout-minutes: 10


    permissions:
      contents: read


    steps:

      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false


      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
          cache: true


      - name: Show Trivy version
        run: |
          trivy --version


      - name: Report HIGH and CRITICAL findings
        run: |
          trivy fs \
            --scanners vuln,misconfig \
            --file-patterns 'pip:requirements-dev\.txt' \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            .


      - name: Enforce fixable HIGH and CRITICAL gate
        run: |
          trivy fs \
            --scanners vuln,misconfig \
            --file-patterns 'pip:requirements-dev\.txt' \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            .

  image-scan:

    name: Docker Image Scan - Trivy

    runs-on: ubuntu-24.04

    timeout-minutes: 15


    permissions:
      contents: read


    needs:
      - test
      - secret-scan
      - sast
      - dependency-scan


    env:
      IMAGE_NAME: secure-task-api:ci-${{ github.sha }}


    steps:

      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false


      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
        with:
          version: v0.74.0
          cache: true


      - name: Show Docker and Trivy versions
        run: |
          docker --version
          trivy --version


      - name: Build Docker image
        run: |
          docker build \
            --pull \
            --tag "$IMAGE_NAME" \
            .


      - name: Verify image metadata
        run: |
          docker image inspect "$IMAGE_NAME" \
            --format='Image={{.RepoTags}} User={{.Config.User}} Size={{.Size}}'


      - name: Report HIGH and CRITICAL image vulnerabilities
        run: |
          trivy image \
            --scanners vuln \
            --pkg-types os,library \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            "$IMAGE_NAME"


      - name: Enforce Docker image vulnerability gate
        run: |
          trivy image \
            --scanners vuln \
            --pkg-types os,library \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --exit-on-eol 1 \
            "$IMAGE_NAME"

  runtime-security:

    name: Runtime Security Validation

    runs-on: ubuntu-24.04

    timeout-minutes: 15

    permissions:
      contents: read

    needs:
      - image-scan

    env:
      DB_USER: secure_app
      DB_NAME: secure_tasks
      TEST_DB_NAME: secure_tasks_test

    steps:

      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Create temporary CI secrets
        run: |
          mkdir -p secrets

          chmod 700 secrets

          openssl rand -hex 32 > secrets/db_password.txt
          openssl rand -hex 32 > secrets/postgres_admin_password.txt

          chmod 644 secrets/db_password.txt
          chmod 644 secrets/postgres_admin_password.txt

      - name: Validate Docker Compose configuration
        run: |
          docker compose config -q

      - name: Start hardened application stack
        run: |
          docker compose up -d --build

      - name: Wait for application readiness
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 30 \
            --retry-delay 2 \
            --retry-connrefused \
            http://127.0.0.1:8080/ready

      - name: Verify database initialization
        run: |
          DB_INIT_ID="$(docker compose ps -a -q db-init)"

          test -n "$DB_INIT_ID"

          EXIT_CODE="$(
            docker inspect \
              "$DB_INIT_ID" \
              --format='{{.State.ExitCode}}'
          )"

          echo "db-init exit code: $EXIT_CODE"

          test "$EXIT_CODE" -eq 0

      - name: Run runtime security validation
        run: |
          ./scripts/runtime-security-checks.sh

      - name: Show container state on failure
        if: ${{ failure() }}
        run: |
          docker compose ps -a
          docker compose logs \
            --no-color \
            --tail=200

      - name: Clean up runtime environment
        if: ${{ always() }}
        run: |
          docker compose down \
            -v \
            --remove-orphans

  security-gate:

    name: Security Gate

    runs-on: ubuntu-24.04

    timeout-minutes: 5


    permissions:
      contents: read


    needs:
      - test
      - secret-scan
      - sast
      - dependency-scan
      - image-scan
      - runtime-security

    if: ${{ always() }}


    steps:

      - name: Verify required CI results
        env:
          TEST_RESULT: ${{ needs.test.result }}
          GITLEAKS_RESULT: ${{ needs.secret-scan.result }}
          SEMGREP_RESULT: ${{ needs.sast.result }}
          DEPENDENCY_SCAN_RESULT: ${{ needs.dependency-scan.result }}
          IMAGE_SCAN_RESULT: ${{ needs.image-scan.result }}
          RUNTIME_SECURITY_RESULT: ${{ needs.runtime-security.result }}

        run: |
          echo "Required CI results:"
          echo "Python Tests:              $TEST_RESULT"
          echo "Gitleaks:                  $GITLEAKS_RESULT"
          echo "Semgrep:                   $SEMGREP_RESULT"
          echo "Trivy Dependency Scan:     $DEPENDENCY_SCAN_RESULT"
          echo "Trivy Docker Image Scan:   $IMAGE_SCAN_RESULT"
          echo "Runtime Security:         $RUNTIME_SECURITY_RESULT"

          if [ "$TEST_RESULT" != "success" ] \
            || [ "$GITLEAKS_RESULT" != "success" ] \
            || [ "$SEMGREP_RESULT" != "success" ] \
            || [ "$DEPENDENCY_SCAN_RESULT" != "success" ] \
            || [ "$IMAGE_SCAN_RESULT" != "success" ] \
            || [ "$RUNTIME_SECURITY_RESULT" != "success" ]; then

              echo
              echo "SECURITY GATE FAILED"
              exit 1
          fi

          echo
          echo "SECURITY GATE PASSED"
